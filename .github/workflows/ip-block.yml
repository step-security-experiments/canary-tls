name: IP Block

on:
  workflow_dispatch:

jobs:
  ip-block:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: prateek-stepsecurity/harden-runner@int
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
           api.github.com:443
           github.com:443
           www.google.com:443
           1.1.1.1:80
           208.67.222.222:*

      - uses: actions/checkout@v3

      - run: curl https://www.google.com
      - name: "do 1.1.1.1:80"
        if: always()  
        run: curl --connect-timeout 5 -Iv "http://1.1.1.1:80" 
      # - name: "do 1.1.1.1:443"
      #   if: always()  
      #   run: curl --connect-timeout 5 -Iv "http://1.1.1.1:443" 
      - name: "do https://microsoft.com"
        if: always()  
        run: curl --connect-timeout 5 -Iv "https://microsoft.com" 
      - name: "do 208.67.222.222:80"
        if: always()  
        run: curl --connect-timeout 5 -Iv "http://208.67.222.222:80" 
      - name: "do 104.16.0.1:80"
        if: always()  
        run: curl --connect-timeout 5 -Iv "http://104.16.0.1:80" 

      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com
          