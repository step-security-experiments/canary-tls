name: Basic Tests

on:
  workflow_dispatch:

jobs:
  egress-test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: |
            www.google.com:443

      - uses: actions/checkout@v3

      - run: curl https://www.google.com
      - name: Run curl https://microsoft.com
        if: always()
        run: curl https://microsoft.com
      - name: sleep
        if: always()
        run: sleep 10
      - name: Run curl https://www.goreleaser.com
        if: always()
        run: curl https://www.goreleaser.com
      - name: DNS debug
        if: always()
        continue-on-error: true
        run: |
          set +e
          resolvectl status
          ls -la /etc/systemd/resolved.conf.d/ /run/systemd/resolved.conf.d/ 2>&1
          cat /etc/resolv.conf
          ss -lunp | grep ':53'
          resolvectl query github.com
          resolvectl query registry-1.docker.io
          getent hosts github.com
